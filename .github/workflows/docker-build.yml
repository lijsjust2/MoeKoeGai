name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: '构建版本（latest 或指定版本号）'
        required: false
        default: 'latest'
        type: string
      create_release:
        description: '是否创建 GitHub Release（用于发布正式版本）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image (AMD64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64
          tags: moekoemusic:amd64-${{ github.event.inputs.build_version }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          outputs: type=docker,dest=/tmp/moekoemusic-amd64.tar
          target: base-amd64

      - name: Build Docker image (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/arm64
          tags: moekoemusic:arm64-${{ github.event.inputs.build_version }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new-arm,mode=max
          outputs: type=docker,dest=/tmp/moekoemusic-arm64.tar
          target: base-arm64

      - name: Update cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new-arm /tmp/.buildx-cache-arm

      - name: Verify built images
        run: |
          echo "=== Verifying AMD64 image ==="
          ls -lh /tmp/moekoemusic-amd64.tar
          file /tmp/moekoemusic-amd64.tar
          
          echo -e "\n=== Verifying ARM64 image ==="
          ls -lh /tmp/moekoemusic-arm64.tar
          file /tmp/moekoemusic-arm64.tar
          
          echo -e "\n=== Checking tar file contents ==="
          tar -tvf /tmp/moekoemusic-amd64.tar | head -5
          tar -tvf /tmp/moekoemusic-arm64.tar | head -5

      - name: Get version and timestamp
        id: version
        run: |
          VERSION="${{ github.event.inputs.build_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="latest"
          fi
          
          TIMESTAMP=$(date -u +%Y%m%d%H%M)
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Rename files with version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          mv /tmp/moekoemusic-amd64.tar "/tmp/moekoemusic-amd64-${VERSION}.tar"
          mv /tmp/moekoemusic-arm64.tar "/tmp/moekoemusic-arm64-${VERSION}.tar"
          
          echo "Renamed files:"
          ls -lh /tmp/moekoemusic-*.tar

      - name: Create Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.build_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "Docker Image ${{ steps.version.outputs.version }}"
          body: |
            Docker 镜像构建版本: ${{ steps.version.outputs.version }}
            
            包含以下架构:
            - AMD64 (x86_64)
            - ARM64 (aarch64)
            
            使用方法:
            ```bash
            # 加载镜像
            docker load -i moekoemusic-amd64-${{ steps.version.outputs.version }}.tar
            # 或
            docker load -i moekoemusic-arm64-${{ steps.version.outputs.version }}.tar
            
            # 运行容器
            docker run -d \
              --name moekoe-music \
              --restart unless-stopped \
              -p 8880:8880 \
              -p 6521:6521 \
              moekoemusic:amd64-${{ steps.version.outputs.version }}
            ```
          draft: false
          prerelease: false
          files: |
            /tmp/moekoemusic-amd64-${{ steps.version.outputs.version }}.tar
            /tmp/moekoemusic-arm64-${{ steps.version.outputs.version }}.tar

      - name: Upload artifacts
        if: github.event.inputs.create_release == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ steps.version.outputs.version }}
          path: |
            /tmp/moekoemusic-amd64-${{ steps.version.outputs.version }}.tar
            /tmp/moekoemusic-arm64-${{ steps.version.outputs.version }}.tar
          retention-days: 7
